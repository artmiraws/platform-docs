apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform-docs.fullname" . }}
  labels:
    {{- include "platform-docs.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "platform-docs.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
