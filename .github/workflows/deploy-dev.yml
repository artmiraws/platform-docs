name: Deploy dev

on:
  push:
    branches: [main]
    paths-ignore:
      - "charts/platform-docs/gitops/**"
  workflow_dispatch:

permissions:
  contents: write

# Only one run writes the digest at a time.
concurrency:
  group: gitops-write
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: platform-docs
  CLUSTER_NAME: todolist-dev
  APP_NAME: platform-docs
  ARGOCD_NAMESPACE: argocd
  NAMESPACE: platform-docs
  HELM_CHART: charts/platform-docs
  DIGEST_FILE: charts/platform-docs/gitops/dev.yaml
  SSM_PREFIX: /todolist/dev/platform-docs

jobs:
  build-and-deploy:
    # Self-hosted ARC runner in the VPC (registered by the platform to this repository). Uses IRSA.
    runs-on: arc-docs-runner
    environment: dev
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          if ! command -v aws >/dev/null 2>&1; then
            curl -sS "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp
            /tmp/aws/install -i "$HOME/.local/aws-cli" -b "$HOME/.local/bin"
          fi
          if ! command -v kubectl >/dev/null 2>&1; then
            curl -sSLO "https://dl.k8s.io/release/v1.36.0/bin/linux/amd64/kubectl"
            chmod +x kubectl && mv kubectl "$HOME/.local/bin/"
          fi
          if ! command -v helm >/dev/null 2>&1; then
            curl -sS "https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz" | tar xz -C /tmp
            mv /tmp/linux-amd64/helm "$HOME/.local/bin/"
          fi
          if ! command -v trivy >/dev/null 2>&1; then
            curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b "$HOME/.local/bin"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show identity (IRSA)
        run: aws sts get-caller-identity

      - name: Lint chart
        run: helm lint "$HELM_CHART"

      - name: Build image
        id: build
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${ECR_REPOSITORY}" >> "$GITHUB_OUTPUT"
          docker build -t "${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}" .

      - name: Scan image (fail on CRITICAL)
        run: |
          set -euo pipefail
          trivy image --severity CRITICAL --exit-code 1 --no-progress \
            --format table --output trivy-report.txt \
            "${{ steps.build.outputs.image }}:${GITHUB_SHA}"

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy-report.txt
          if-no-files-found: ignore

      - name: Push image
        id: push
        run: |
          set -euo pipefail
          REGISTRY="${{ steps.build.outputs.registry }}"
          IMAGE="${{ steps.build.outputs.image }}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          docker push "${IMAGE}:${GITHUB_SHA}" | tee /tmp/push.out
          DIGEST="$(grep -oE 'sha256:[0-9a-f]{64}' /tmp/push.out | tail -1)"
          test -n "$DIGEST"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pushed digest: ${DIGEST}"

      - name: Commit digest (GitOps)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          sed -i -E "s|^([[:space:]]*digest:).*|\1 \"${DIGEST}\"|" "$DIGEST_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- "$DIGEST_FILE"; then
            echo "Digest unchanged; nothing to commit"
          else
            git add "$DIGEST_FILE"
            git commit -m "chore(deploy): dev image ${DIGEST} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      - name: Wait for Argo CD to sync
        run: |
          set -euo pipefail
          kubectl -n "$ARGOCD_NAMESPACE" annotate application "$APP_NAME" \
            argocd.argoproj.io/refresh=hard --overwrite || true
          for i in $(seq 1 40); do
            SYNC="$(kubectl -n "$ARGOCD_NAMESPACE" get application "$APP_NAME" -o jsonpath='{.status.sync.status}' 2>/dev/null || true)"
            HEALTH="$(kubectl -n "$ARGOCD_NAMESPACE" get application "$APP_NAME" -o jsonpath='{.status.health.status}' 2>/dev/null || true)"
            echo "sync=${SYNC} health=${HEALTH} ($i)"
            if [ "$SYNC" = "Synced" ] && [ "$HEALTH" = "Healthy" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "Argo CD did not reach Synced/Healthy in time"
          kubectl -n "$ARGOCD_NAMESPACE" get application "$APP_NAME" -o yaml | tail -50
          exit 1

      - name: Smoke test
        run: |
          set -euo pipefail
          DOCS_HOSTNAME="$(aws ssm get-parameter --name "${SSM_PREFIX}/app_hostname" --query Parameter.Value --output text)"
          for i in $(seq 1 20); do
            if curl -fsS --max-time 15 "https://${DOCS_HOSTNAME}/healthz"; then
              echo; echo "Smoke test passed"; exit 0
            fi
            echo "waiting for ${DOCS_HOSTNAME}... ($i)"
            sleep 15
          done
          echo "Smoke test failed"; exit 1
