site_name: Platform Handbook
site_description: How the platform is planned, built, and operated, and how to add an application to it.
docs_dir: docs
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Getting started:
      - Overview: getting-started/overview.md
      - Prerequisites: getting-started/prerequisites.md
      - Repository structure: getting-started/repository-structure.md
      - Run the handbook locally: getting-started/run-the-handbook.md
  - Concepts:
      - Environments: concepts/environments.md
      - Ownership: concepts/ownership.md
      - The contract: concepts/contract.md
  - Architecture:
      - Overview: architecture/overview.md
      - GitOps: architecture/gitops.md
  - Onboarding:
      - Add an application: onboarding/add-an-application.md
      - "Worked example: TodoList": onboarding/worked-example.md
      - ApplicationSet: onboarding/applicationset.md
      - Pipeline: onboarding/pipeline.md
  - Operations:
      - Runbook: operations/runbook.md
      - Hardening backlog: operations/hardening.md
  - Decisions:
      - ADRs: decisions/index.md
      - "Open discussion: app infrastructure": decisions/open-discussion.md
  - Reference:
      - Vendored charts: reference/vendored-charts.md
  - Costs: costs.md
